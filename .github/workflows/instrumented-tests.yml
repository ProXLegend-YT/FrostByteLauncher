name: Instrumented Tests

# Instrumented tests need a real (emulated) Android device and are
# significantly slower/more expensive than the JVM unit test suite in
# build.yml, so this runs on pull requests and on demand rather than on
# every push to main - the fast unit-test suite already catches most
# regressions immediately; this catches the smaller set of things that
# genuinely need Room/Context/InputManager (see app/src/androidTest).
on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  instrumented-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM (required for a hardware-accelerated emulator on the GitHub-hosted runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/
          if-no-files-found: warn
