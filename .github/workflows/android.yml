name: FrostByte Launcher CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FROSTBYTE_KEYSTORE_PASSWORD: ${{ secrets.FROSTBYTE_KEYSTORE_PASSWORD }}
      FROSTBYTE_KEY_ALIAS: ${{ secrets.FROSTBYTE_KEY_ALIAS }}
      FROSTBYTE_KEY_PASSWORD: ${{ secrets.FROSTBYTE_KEY_PASSWORD }}
      FROSTBYTE_KEYSTORE_BASE64: ${{ secrets.FROSTBYTE_KEYSTORE_BASE64 }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      # Decodes the FROSTBYTE_KEYSTORE_BASE64 secret back into a real .jks file for this build
      # only — it never touches the repo itself, so the signing key stays out of git history.
      # `secrets.*` can't be read directly in `if:` conditions, so it's mirrored into the
      # FROSTBYTE_KEYSTORE_BASE64 env var above and checked from there instead.
      - name: Decode release keystore
        if: ${{ env.FROSTBYTE_KEYSTORE_BASE64 != '' }}
        run: echo "$FROSTBYTE_KEYSTORE_BASE64" | base64 -d > app_pojavlauncher/frostbyte_release.jks

      # Optional: only needed if FrostByte depends on the same prebuilt AARs
      # upstream Mojo does. Safe to delete this step if not.
      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: whitebelyash/mesa-unified
          workflow: android.yml
          workflow_conclusion: success
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create out directory
        run: mkdir out

      - name: Clean previous build outputs
        run: gradle :app_pojavlauncher:clean

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleFullDebug
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/FrostByteLauncher-debug.apk

      - name: Build Debug APK (No runtime)
        run: |
          gradle :app_pojavlauncher:assembleNoruntimeDebug
          mv app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/FrostByteLauncher-debug-noruntime.apk

      - name: Build Optimized APK (minified, shrunk resources)
        run: |
          gradle :app_pojavlauncher:assembleFullProguardNoDebug
          mv app_pojavlauncher/build/outputs/apk/full/proguardNoDebug/app_pojavlauncher-full-proguardNoDebug.apk out/FrostByteLauncher-optimized.apk

      - name: Gen md5sums
        run: |
          md5sum out/FrostByteLauncher-debug.apk > out/FrostByteLauncher-debug.md5
          md5sum out/FrostByteLauncher-debug-noruntime.apk > out/FrostByteLauncher-debug-noruntime.md5
          md5sum out/FrostByteLauncher-optimized.apk > out/FrostByteLauncher-optimized.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostByteLauncher-debug
          path: out/FrostByteLauncher-debug.apk

      - name: Upload Debug APK (No runtime)
        uses: actions/upload-artifact@v4
        with:
          name: FrostByteLauncher-debug-noruntime
          path: out/FrostByteLauncher-debug-noruntime.apk

      - name: Upload Optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostByteLauncher-optimized
          path: out/FrostByteLauncher-optimized.apk

      - name: Build Release APK
        if: ${{ env.FROSTBYTE_KEYSTORE_BASE64 != '' }}
        run: |
          gradle :app_pojavlauncher:assembleFullRelease
          mv app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/FrostByteLauncher-release.apk

      - name: Gen release md5sum
        if: ${{ env.FROSTBYTE_KEYSTORE_BASE64 != '' }}
        run: md5sum out/FrostByteLauncher-release.apk > out/FrostByteLauncher-release.md5

      - name: Upload Release APK
        if: ${{ env.FROSTBYTE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FrostByteLauncher-release
          path: out/FrostByteLauncher-release.apk
