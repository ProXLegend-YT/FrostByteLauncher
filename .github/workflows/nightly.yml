name: Nightly Build

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper jar (if missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        # A nightly build with failing tests is worse than no nightly build -
        # this step failing stops the workflow before assembleDebug runs.
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename artifact as nightly
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk FrostByteLauncher-nightly-$(date +%Y%m%d).apk

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostByteLauncher-nightly
          path: app/build/outputs/apk/debug/FrostByteLauncher-nightly-*.apk
          if-no-files-found: error
          retention-days: 14
